server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"The mock API runs in the browser."}}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
